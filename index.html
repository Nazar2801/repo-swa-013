<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estimasi Biaya Kegiatan - [Nama Anda]</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f6f8; }
        .container { background: white; padding: 24px; border-radius: 12px; max-width: 500px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #1f4e79; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #1f4e79; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #153a5a; }
        #hasil { margin-top: 20px; padding: 15px; background: #e7f3ff; border-radius: 8px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Estimasi Biaya Konsumsi</h1>
        <p>Mahasiswa: <strong>Nazar (NIM-013)</strong></p>
        
        <div class="form-group">
            <label>Jumlah Peserta:</label>
            <input type="number" id="jumlah" value="40">
        </div>
        
        <div class="form-group">
            <label>Jenis Konsumsi:</label>
            <select id="jenis">
                <option value="snack">Snack (Rp15.000)</option>
                <option value="makan">Makan (Rp30.000)</option>
                <option value="lengkap">Lengkap (Rp45.000)</option>
            </select>
        </div>
        
        <button onclick="hitungBiaya()">Hitung Estimasi</button>

        <div id="hasil">
            <h3>Hasil Perhitungan:</h3>
            <p id="res-detail"></p>
            <p><strong>Total: <span id="res-total"></span></strong></p>
            <small id="res-time"></small>
        </div>
    </div>

    <script>
        async function hitungBiaya() {
            const jumlah = document.getElementById('jumlah').value;
            const jenis = document.getElementById('jenis').value;
            const hasilDiv = document.getElementById('hasil');

            // GANTI URL DI BAWAH INI dengan URL Azure Function Anda (dari Praktikum 4)
            const functionUrl = `https://func-serverless-013.azurewebsites.net/api/EstimasiBiaya?jumlah=${jumlah}&jenis=${jenis}`;

            try {
                const response = await fetch(functionUrl);
                const data = await response.json();

                document.getElementById('res-detail').innerText = `Jenis: ${data.jenis} x ${data.jumlah} peserta`;
                document.getElementById('res-total').innerText = `Rp${data.total.toLocaleString('id-ID')}`;
                document.getElementById('res-time').innerText = `Waktu Server: ${data.timestamp}`;
                
                hasilDiv.style.display = 'block';
            } catch (error) {
                alert("Gagal mengambil data dari API. Pastikan URL benar dan CORS sudah diatur!");
                console.error(error);
            }
        }
    </script>
</body>
</html>
